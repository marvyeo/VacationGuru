<script>
/* ===== Config ===== */
const CLIENT_ID = '669494100250-gvromuq72r7j0djmkd4vdbdq5damncj7.apps.googleusercontent.com';
const SCOPE = 'https://www.googleapis.com/auth/drive';   // full Drive scope so a second Google account can open a file shared with it
const FILE_NAME = 'vacationguru-data.json';
const LS_KEY = 'vacationguru-data-v1';
const TYPES = { accommodation: ['🛏️', 'Stay'], dining: ['🍽️', 'Dining'], activity: ['🎟️', 'Activity'], transport: ['✈️', 'Transport'], booking: ['📌', 'Booking'], shopping: ['🛍️', 'Shopping'], rest: ['😴', 'Rest'] };
const STATUS = { planning: ['Planning', 'bg-sand-200 text-navy-800'], active: ['Active', 'bg-emerald-100 text-emerald-800'], locked: ['Locked', 'bg-navy-800 text-sand-100'] };

const CATS = { flight: ['✈️', 'Flight'], stay: ['🛏️', 'Stay'], car: ['🚗', 'Car rental'], attraction: ['🎟️', 'Activity'], other: ['📌', 'Other'] };
const VIAS = ['Direct', 'Trip.com', 'Agoda', 'Klook', 'Booking.com'];

/* ===== Helpers ===== */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const todayStr = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const dayDiff = (a, b) => Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 864e5);
const addDays = (s, n) => new Date(new Date(s + 'T00:00:00Z').getTime() + n * 864e5).toISOString().slice(0, 10);
const fmtDate = s => s ? new Date(s + 'T00:00:00Z').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }) : '';
const fmtShort = s => s ? new Date(s + 'T00:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' }) : '';
const money = n => (n || n === 0) && n !== '' ? '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 }) : '';
const num = v => (v === '' || v == null || isNaN(Number(v))) ? null : Number(v);
const stars = (r, attr) => [1, 2, 3, 4, 5].map(i => `<span class="star ${i <= (r || 0) ? 'on' : ''}" ${attr ? `data-star="${i}"` : ''}>★</span>`).join('');

/* ===== Seed: Perth & Margaret River (reconciled with Life Planner, 2026-10) ===== */
function seedPerth() {
  const s = (type, time, title, notes = '', extra = {}) => ({ id: uid(), type, time, title, notes, cost: null, link: '', rating: 0, actualNotes: '', ...extra });
  const days = [
    ['2026-11-02', [
      s('transport', '07:20', 'SQ213 Singapore → Perth', 'Marvin + Cobae and Caroline booked on separate SIA tickets (see Bookings).'),
      s('transport', '', 'Collect rental car — Ace, Redcliffe', 'Shuttle from T1.'),
      s('accommodation', '', 'Adina Apartment Hotel Barrack Plaza — check in', 'Booked 2–5 Nov. ⚠ Quest is booked 4–5 Nov, which overlaps; confirm actual nights.')]],
    ['2026-11-03', [s('activity', '', 'Perth Zoo', 'Booked and paid.')]],
    ['2026-11-04', [
      s('activity', '', 'Rottnest Island — ferry + bus', 'Day TBC. Ferry via Klook, bus booked and paid.'),
      s('accommodation', '', 'Quest — check in', 'Booked 4–5 Nov via Trip.com, amount not recorded. ⚠ Check overlap with Adina.')]],
    ['2026-11-05', [
      s('transport', '', 'Drive to Margaret River'),
      s('accommodation', '', 'Margaret River Resort — check in', 'Booked 5–7 Nov.')]],
    ['2026-11-06', [
      s('activity', '', 'Jewel Cave', 'Front carrier only — no prams.'),
      s('dining', '', 'Leeuwin Estate area wineries', 'To check: which are toddler-friendly.')]],
    ['2026-11-07', [
      s('transport', '', 'Drive back to Perth'),
      s('accommodation', '', 'Adina Barrack Plaza — check in', 'Booked 7–8 Nov.')]],
    ['2026-11-08', [
      s('transport', '09:45', 'Leave hotel', 'Must leave by 9:45am to return the car on time.'),
      s('transport', '10:30', 'Return rental car — Ace, Redcliffe'),
      s('transport', '13:50', 'SQ226 Perth → Singapore')]]
  ].map(([date, stops]) => ({ date, stops }));
  const b = (title, cost, notes = '') => ({ id: uid(), title, confirmation: '', cost, deadline: '', booked: true, notes });
  return {
    id: 'perth-2026', name: 'Perth & Margaret River', destination: 'Perth, Western Australia', start: '2026-11-02', end: '2026-11-08',
    status: 'planning', tags: ['family', 'toddler', 'road trip', 'wine'], budgetTier: '$$', travellers: ['Marvin', 'Caroline', 'Cobae (toddler)', 'Guest adult'],
    notes: 'Costs below are as recorded in the Life Planner (assumed SGD). All bookings settled outside the app.', lockedAt: null, days,
    bookings: [
      b('SIA flights — Marvin + Cobae', 1408), b('SIA flight — Caroline', 908.8),
      b('Adina Barrack Plaza, 2–5 Nov (Trip.com)', 1371.41, 'Deduction 30 Oct'),
      b('Quest, 4–5 Nov (Trip.com)', null, 'Amount not recorded'),
      b('Margaret River Resort, 5–7 Nov (Trip.com)', 752.25, 'Paid 4 Jul'),
      b('Adina Barrack Plaza, 7–8 Nov (Trip.com)', 499.37, 'Deduction 4 Oct'),
      b('Car rental — Ace, Redcliffe (Klook)', 488.9, 'Paid 9 Aug'),
      b('Perth Zoo', 144.02, 'Paid 28 Sep'), b('Rottnest bus', 131.56, 'Paid 28 Sep'),
      b('Rottnest ferry (Klook)', null, 'Settled outside the app; amount to enter'),
      b('Jewel Cave (Klook)', null, 'Settled outside the app; amount to enter')]
  };
}

/* ===== State ===== */
let D = load();
let view = { page: 'list', tripId: null, tab: 'itinerary' };
let sync = { status: 'off', msg: '' };
let token = null, fileId = null, tokenClient = null, syncTimer = null;

function load() {
  try { const r = JSON.parse(localStorage.getItem(LS_KEY)); if (r && Array.isArray(r.trips)) return migrate(r); } catch (e) {}
  const d = { version: 1, trips: [seedPerth()], upcoming: [], updatedAt: 0, seed: true };   // seed = never synced; Drive data always wins over it
  migrate(d); d.upcoming = computeUpcoming(d); return d;
}
const trip = () => D.trips.find(t => t.id === view.tripId);

/* upcoming[] — root of vacationguru-data.json, recomputed on every save */
function computeUpcoming(d) {
  const today = todayStr(), out = [];
  for (const t of d.trips) {
    if (t.status === 'locked') continue;
    const away = dayDiff(today, t.start);
    if (away >= 0) out.push({ id: 'trip-' + t.id, type: 'trip', title: t.name, date: t.start, priority: away <= 7 ? 'high' : 'normal', source: 'vacationguru' });
    for (const bk of t.bookings) if (!bk.booked && bk.deadline)
      out.push({ id: 'due-' + bk.id, type: 'due-date', title: `${t.name}: ${bk.title}`, date: bk.deadline, priority: dayDiff(today, bk.deadline) <= 7 ? 'high' : 'normal', source: 'vacationguru' });
    for (const c of (t.checklist || [])) if (!c.done && c.due)
      out.push({ id: 'chk-' + c.id, type: 'due-date', title: `${t.name}: ${c.text}`, date: c.due, priority: dayDiff(today, c.due) <= 7 ? 'high' : 'normal', source: 'vacationguru' });
  }
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
function commit() {
  D.updatedAt = Date.now(); D.upcoming = computeUpcoming(D);
  try { localStorage.setItem(LS_KEY, JSON.stringify(D)); } catch (e) {}
  render(); scheduleSync();
}

/* ===== Drive sync: direct fetch, res.ok checks, 401 reconnect, safe two-way merge ===== */
const META_KEY = 'vacationguru-sync-meta', FILE_KEY = 'vacationguru-file-id', CONN_KEY = 'vacationguru-connected', BAK_KEY = 'vacationguru-backup';
const hhmm = () => new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };
const getMeta = () => { try { return JSON.parse(lsGet(META_KEY)) || { syncedAt: 0 }; } catch (e) { return { syncedAt: 0 }; } };
const setMeta = at => lsSet(META_KEY, JSON.stringify({ syncedAt: at }));
const modalOpen = () => !$('#modal').classList.contains('hidden');

function setSync(status, msg) {
  sync = { status, msg }; $('#syncMsg').textContent = msg || '';
  $('#syncBtn').textContent = status === 'off' ? 'Connect Drive' : status === 'reconnect' || status === 'error' ? 'Reconnect' : status === 'nofile' ? 'Retry' : 'Sync now';
  $('#bakBtn').classList.toggle('hidden', !lsGet(BAK_KEY));
}
async function drive(url, opts = {}) {
  if (!token) throw new Error('Not connected');
  const r = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + token } });
  if (r.status === 401) { token = null; setSync('reconnect', 'Session expired. Tap to reconnect'); armTapConnect(); throw new Error('401'); }
  if (!r.ok) throw new Error('Drive ' + r.status + ': ' + (await r.text()).slice(0, 120));
  return r;
}
function forgetFile() { fileId = null; lsDel(FILE_KEY); }
/* Finds the data file. Remembers the id once found. With the full Drive scope this also finds a file another Google account shared with this one. */
async function findFile() {
  const saved = lsGet(FILE_KEY);
  if (saved) {
    try { const m = await (await drive(`https://www.googleapis.com/drive/v3/files/${saved}?fields=id,trashed`)).json(); if (m.id && !m.trashed) return m.id; }
    catch (e) { if (e.message === '401') throw e; }
    lsDel(FILE_KEY);
  }
  const q = encodeURIComponent(`name='${FILE_NAME}' and trashed=false`);
  const j = await (await drive(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&orderBy=modifiedTime%20desc&fields=files(id,ownedByMe,modifiedTime)`)).json();
  const id = (j.files && j.files[0]) ? j.files[0].id : null;
  if (id) lsSet(FILE_KEY, id);
  return id;
}
async function readRemote() {
  for (let tries = 0; tries < 2; tries++) {
    if (!fileId) fileId = await findFile();
    if (!fileId) return null;
    try { return await (await drive(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`)).json(); }
    catch (e) { if (/^Drive 404/.test(e.message)) { forgetFile(); continue; } throw e; }
  }
  return null;
}
async function push() {
  const at = D.updatedAt || 0, body = JSON.stringify(D);
  if (!fileId) {
    const bd = 'vg' + uid();
    const mp = `--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({ name: FILE_NAME, mimeType: 'application/json' })}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${bd}--`;
    const j = await (await drive('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + bd }, body: mp })).json();
    if (!j.id) throw new Error('Create returned no file id');
    fileId = j.id; lsSet(FILE_KEY, fileId);
  } else {
    await drive(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body });
  }
  setMeta(at);
}
function adopt(remote) {
  D = migrate(remote); delete D.seed; D.upcoming = computeUpcoming(D);
  lsSet(LS_KEY, JSON.stringify(D)); setMeta(D.updatedAt || 0); render();
}
function saveBackup(obj) { lsSet(BAK_KEY, JSON.stringify({ at: Date.now(), data: obj })); }
function restoreBackup() {
  let b; try { b = JSON.parse(lsGet(BAK_KEY)); } catch (e) {}
  if (!b || !b.data) return;
  if (!confirm('Restore the backup saved ' + new Date(b.at).toLocaleString('en-GB') + '? It replaces what is on this device and then syncs to Drive.')) return;
  D = migrate(b.data); delete D.seed; lsDel(BAK_KEY); commit(); setSync(sync.status, sync.msg);
}
/* One routine for every sync: read Drive, decide who is newer, then adopt, push or do nothing. It never pushes untouched seed data. */
let syncing = false, syncAgain = false;
async function syncNow(opts = {}) {
  if (!token) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true;
  try {
    if (!opts.quiet) setSync('busy', 'Syncing…');
    const remote = await readRemote();
    const ok = !!(remote && Array.isArray(remote.trips)), rUp = ok ? (remote.updatedAt || 0) : 0;
    const lUp = D.updatedAt || 0, m = getMeta();
    const dirty = !D.seed && lUp > m.syncedAt, remoteNew = rUp > m.syncedAt;
    let msg = 'Synced ' + hhmm();
    if (!ok) {
      if (D.seed) { setSync('nofile', 'No itinerary file found for this Google account. Ask the owner to share it'); return; }
      await push(); msg = 'Saved ' + hhmm();
    } else if (D.seed) {
      if (lUp > 0) saveBackup(D);
      adopt(remote); msg = 'Loaded from Drive ' + hhmm();
    } else if (rUp === lUp) { setMeta(rUp);
    } else if (remoteNew && !dirty) { adopt(remote); msg = 'Updated ' + hhmm();
    } else if (remoteNew && dirty) {
      if (rUp > lUp) { saveBackup(D); adopt(remote); msg = 'Both changed: kept the newer Drive copy (yours saved as backup)'; }
      else { saveBackup(remote); await push(); msg = 'Both changed: kept your newer copy (Drive copy saved as backup)'; }
    } else if (dirty) { await push(); msg = 'Saved ' + hhmm(); }
    setSync('ok', msg);
  } catch (e) { if (e.message !== '401') setSync('error', 'Sync failed: ' + e.message); }
  finally { syncing = false; if (syncAgain) { syncAgain = false; setTimeout(() => syncNow({ quiet: true }), 300); } }
}
function scheduleSync() {
  if (!token) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => syncNow(), 800);
}
function connect() {
  if (!window.google || !google.accounts) { setSync('error', 'Google sign-in still loading. Retry'); return; }
  if (!tokenClient) tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPE,
    callback: r => { if (r.error || !r.access_token) { setSync('error', 'Sign-in failed: ' + (r.error || 'no token')); return; } token = r.access_token; lsSet(CONN_KEY, '1'); syncNow(); },
    error_callback: e => setSync('error', e && e.type === 'popup_failed_to_open' ? 'Popup blocked. Allow popups, or open this page in Safari/Chrome' : 'Sign-in cancelled')
  });
  tokenClient.requestAccessToken({ prompt: '' });
}
/* A browser only lets sign-in open from a tap, so after the first connect the next tap anywhere reconnects. */
let tapArmed = false;
function armTapConnect() {
  if (tapArmed || token || !lsGet(CONN_KEY)) return;
  tapArmed = true;
  document.addEventListener('click', e => { tapArmed = false; if (!token && !e.target.closest('#syncBtn')) connect(); }, { once: true });
}
$('#syncBtn').onclick = () => { if (token) syncNow(); else connect(); };
$('#bakBtn').onclick = restoreBackup;
function bootSync() {
  if (lsGet(CONN_KEY)) { setSync('reconnect', 'Tap anywhere to sync with Drive'); armTapConnect(); }
  setInterval(() => { if (token && !document.hidden && !modalOpen()) syncNow({ quiet: true }); }, 45000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) return; if (token) { if (!modalOpen()) syncNow({ quiet: true }); } else armTapConnect(); });
  window.addEventListener('online', () => { if (token && !modalOpen()) syncNow({ quiet: true }); });
  const ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua);
  if (/FBAN|FBAV|Instagram|Line\/|MicroMessenger|WhatsApp|Telegram|GSA\/|; wv\)/i.test(ua) || (ios && !/Safari\//.test(ua) && !navigator.standalone))
    $('#warn').classList.remove('hidden');
}
$('#home').onclick = e => { e.preventDefault(); view = { page: 'list', tripId: null, tab: 'itinerary' }; render(); };

/* ===== Modal ===== */
function openModal(html, onSubmit) {
  $('#modalBox').innerHTML = html; $('#modal').classList.remove('hidden');
  const f = $('#modalBox form');
  if (f) f.onsubmit = e => { e.preventDefault(); const ok = onSubmit(new FormData(f), f); if (ok !== false) closeModal(); };
}
const blobUrls = [];   // object URLs made for menu photos; freed when the modal closes
function closeModal() { blobUrls.splice(0).forEach(u => URL.revokeObjectURL(u)); $('#modal').classList.add('hidden'); $('#modalBox').innerHTML = ''; }
$('#modal').addEventListener('mousedown', e => { if (e.target.id === 'modal' || e.target.parentElement?.id === 'modal') closeModal(); });
const field = (label, name, val = '', type = 'text', extra = '') => `<label class="lbl">${label}</label><input class="inp" name="${name}" type="${type}" value="${esc(val)}" ${extra}>`;
const modalFoot = (extra = '') => `<div class="flex justify-between mt-5"><div>${extra}</div><div class="flex gap-2"><button type="button" class="btn btn-sand" onclick="closeModal()">Cancel</button><button class="btn btn-primary">Save</button></div></div>`;

/* ===== Views ===== */
function render() {
  const app = $('#app');
  if (view.page === 'trip' && trip()) app.innerHTML = tripView(trip()); else { view.page = 'list'; app.innerHTML = listView(); }
}
function badge(st) { const [l, c] = STATUS[st]; return `<span class="badge ${c}">${l}</span>`; }

function listView() {
  const trips = [...D.trips].sort((a, b) => b.start.localeCompare(a.start));
  const up = D.upcoming.slice(0, 4);
  return `
  <div class="flex items-end justify-between mb-5"><div><h1 class="font-serif text-3xl font-bold">Your trips</h1><p class="text-sm text-navy-600">Planning → Active → Locked</p></div>
  <div class="flex gap-2"><button class="btn btn-sand" data-act="importTrip">Import</button><button class="btn btn-primary" data-act="newTrip">+ New trip</button></div></div>
  ${up.length ? `<div class="card p-4 mb-5 bg-sand-100"><div class="text-xs uppercase tracking-wider text-sand-600 mb-2">Coming up</div>${up.map(u => `<div class="flex justify-between text-sm py-0.5"><span>${u.type === 'trip' ? '✈️' : '⏰'} ${esc(u.title)}</span><span class="${u.priority === 'high' ? 'text-red-700 font-semibold' : 'text-navy-600'}">${fmtShort(u.date)}</span></div>`).join('')}</div>` : ''}
  <div class="grid gap-3">${trips.length ? trips.map(t => {
    const total = tripTotal(t);
    return `<div class="card p-4 cursor-pointer hover:shadow-md transition" data-act="openTrip" data-id="${t.id}">
      <div class="flex justify-between items-start gap-2"><div><div class="font-serif text-xl font-bold">${esc(t.name)}</div><div class="text-sm text-navy-600">${esc(t.destination)} · ${fmtShort(t.start)} – ${fmtShort(t.end)} · ${t.days.length} days</div></div>${badge(t.status)}</div>
      <div class="flex flex-wrap gap-1 mt-2 items-center">${t.tags.map(g => `<span class="badge bg-sand-100 text-sand-600">${esc(g)}</span>`).join('')}<span class="text-xs text-navy-600 ml-auto">${t.budgetTier} ${total ? '· ' + money(total) : ''}</span></div></div>`;
  }).join('') : '<div class="card p-8 text-center text-navy-600">No trips yet. Create one to get started.</div>'}</div>`;
}

function tripTotal(t) {
  return t.bookings.reduce((s, b) => s + (Number(b.cost) || 0), 0) + t.days.reduce((s, d) => s + d.stops.reduce((x, st) => x + (Number(st.cost) || 0), 0), 0);
}

function tripView(t) {
  const locked = t.status === 'locked';
  const tabs = [['itinerary', 'Itinerary'], ['food', 'Food'], ['bookings', 'Bookings'], ['checklist', 'Checklist'], ['summary', 'Summary']];
  return `
  <button class="text-sm text-sand-600 mb-2" data-act="back">← All trips</button>
  <div class="flex flex-wrap justify-between items-start gap-3 mb-4">

    <div class="flex flex-wrap gap-2">

}

function itineraryTab(t, locked) {

      <div class="flex justify-between items-center mb-2"><div class="font-serif text-lg font-bold">Day ${i + 1} <span class="font-sans text-sm font-normal text-navy-600">· ${fmtDate(d.date)}${d.title ? ' · ' + esc(d.title) : ''}</span></div>
      ${locked ? '' : `<button class="btn btn-sand" data-act="addStop" data-day="${i}">+ Stop</button>`}</div>
      ${stops.length ? stops.map((s, k) => {
        const sp = stopSpan(stops, k);
        const pre = (s.bookingIds || []).map(id => t.bookings.find(b => b.id === id)).filter(b => b && b.cost);
        const prompt = !locked && pre.length && s.cost == null ? `<button class="badge bg-amber-100 text-amber-800 mt-1" data-act="editStop" data-day="${i}" data-id="${s.id}">＋ Add on-the-day spend (booked ${money(pre.reduce((x, b) => x + Number(b.cost), 0))})</button>` : '';
        return `<div class="grid grid-cols-[5.5rem_1fr] gap-3 py-2 border-t border-sand-100 ${locked ? 'ro' : ''}">
          <div class="text-right leading-tight">
            ${s.time ? `<div class="font-semibold text-sm">${esc(s.time)}</div>` : '<div class="text-xs text-navy-600">no time</div>'}
            ${sp ? `<div class="text-xs ${sp.inferred ? 'text-navy-600' : 'font-medium'}">${sp.inferred ? '~' : '→ '}${esc(sp.end)}</div>${sp.dur ? `<div class="mt-0.5"><span class="badge bg-sand-100 text-sand-600">${sp.inferred ? '~' : ''}${sp.dur}</span></div>` : ''}` : ''}
          </div>

            ${s.notes ? `<div class="text-sm text-navy-600">${esc(s.notes)}</div>` : ''}${s.actualNotes ? `<div class="text-sm italic text-sand-600">Actual: ${esc(s.actualNotes)}</div>` : ''}

          </div></div>`;
      }).join('') : '<div class="text-sm text-navy-600 py-1">Nothing planned yet.</div>'}
    </div>`;
  }).join('');
}

function bookingsTab(t, locked) {

    return `<div class="card p-3 flex items-start gap-3">

function summaryTab(t) {
  const bTotal = t.bookings.reduce((s, b) => s + (Number(b.cost) || 0), 0);
  const sTotal = t.days.reduce((s, d) => s + d.stops.reduce((x, st) => x + (Number(st.cost) || 0), 0), 0);
  const missing = t.bookings.filter(b => b.cost == null).length;
  const rated = t.days.flatMap(d => d.stops).filter(s => s.rating);
  const avg = rated.length ? (rated.reduce((s, x) => s + x.rating, 0) / rated.length).toFixed(1) : '—';
  const byType = {}; t.days.forEach(d => d.stops.forEach(s => byType[s.type] = (byType[s.type] || 0) + 1));
  const locked = D.trips.filter(x => x.status === 'locked' && x.id !== t.id);
  return `<div class="grid grid-cols-2 gap-3 mb-4">
    ${[['Bookings total', money(bTotal) || '$0'], ['On-the-day spend', money(sTotal) || '$0'], ['Grand total', money(bTotal + sTotal) || '$0'], ['Avg rating', avg]].map(([l, v]) => `<div class="card p-4"><div class="text-xs uppercase tracking-wider text-sand-600">${l}</div><div class="font-serif text-2xl font-bold">${v}</div></div>`).join('')}</div>
    ${missing ? `<p class="text-sm text-amber-800 mb-3">⚠ ${missing} booking${missing > 1 ? 's have' : ' has'} no amount recorded, so totals are incomplete.</p>` : ''}
    <div class="card p-4 mb-4"><div class="text-xs uppercase tracking-wider text-sand-600 mb-2">Progress</div>${(() => {
      const ck = t.checklist || [], food = t.days.flatMap(d => d.stops).filter(s => s.type === 'dining');
      return [['Bookings booked', t.bookings.filter(b => b.booked).length, t.bookings.length], ['Checklist done', ck.filter(c => c.done).length, ck.length], ['Food places with a menu', food.filter(s => (s.menuImages || []).length).length, food.length]]
        .map(([l, a, n]) => `<div class="flex justify-between text-sm"><span>${l}</span><span>${a} / ${n}</span></div>`).join('');
    })()}</div>
    <div class="card p-4"><div class="text-xs uppercase tracking-wider text-sand-600 mb-2">Stops by type</div>${Object.entries(byType).map(([k, v]) => `<div class="flex justify-between text-sm"><span>${TYPES[k][0]} ${TYPES[k][1]}</span><span>${v}</span></div>`).join('') || '<span class="text-sm text-navy-600">None</span>'}</div>
    <p class="text-xs text-navy-600 mt-3">Tags: ${t.tags.map(esc).join(', ') || '—'} · Budget tier ${t.budgetTier}${locked.length ? '' : ''}</p>
    ${t.notes ? `<p class="text-sm mt-3">${esc(t.notes)}</p>` : ''}`;
}

/* ===== Booking details, checklist, migration ===== */
function bookingMeta(b) {
  const p = [];
  if (b.carrier) p.push(esc(b.carrier));
  if (b.bookedVia) p.push('via ' + esc(b.bookedVia));
  if (b.pax) p.push(b.pax + ' pax');
  if (b.confirmation) p.push('Ref: ' + esc(b.confirmation));
  if (b.seats) p.push('Seats: ' + esc(b.seats));
  if (b.notes) p.push(esc(b.notes));
  return p.join(' · ');
}
function linkedLines(t, s) {
  return (s.bookingIds || []).map(id => t.bookings.find(b => b.id === id)).filter(Boolean)
    .map(b => `<div class="text-xs text-sand-600">🔗 ${esc(b.title)}${b.cost != null ? ' · ' + money(b.cost) : ''}${bookingMeta(b) ? ' · ' + bookingMeta(b) : ''}${b.booked ? '' : ' · <span class="text-red-700 font-medium">⚠ not booked yet</span>'}</div>`).join('');
}
/* Cross-tab links: stops ↔ bookings (stop.bookingIds) and checklist ↔ bookings (item.bookingId). One flag, shown everywhere. */
function setBooked(t, b, v) { b.booked = v; (t.checklist || []).forEach(c => { if (c.bookingId === b.id) c.done = v; }); }
function setCheck(t, c, v) {
  c.done = v;
  const b = c.bookingId && t.bookings.find(x => x.id === c.bookingId);
  if (b && t.status !== 'locked') setBooked(t, b, v);   // a locked trip's bookings stay read-only
}
function checkLink(t, c) {
  const b = c.bookingId && t.bookings.find(x => x.id === c.bookingId); if (!b) return '';
  return ` <span class="text-xs text-sand-600">🔗 ${esc(b.title)}</span>` + (!!c.done !== !!b.booked ? ` <span class="badge bg-amber-100 text-amber-800">Booking is marked ${b.booked ? 'paid' : 'not paid'}</span>` : '');
}
function usedBy(t, b) {
  const uses = t.days.flatMap((d, i) => d.stops.filter(s => (s.bookingIds || []).includes(b.id)).map(s => `Day ${i + 1} ${s.title}`));
  const chk = (t.checklist || []).filter(c => c.bookingId === b.id).map(c => `Checklist: ${c.text}`);
  const all = [...uses.slice(0, 3), ...(uses.length > 3 ? ['+' + (uses.length - 3) + ' more stops'] : []), ...chk];
  return all.length ? `<div class="text-xs text-sand-600">Used in: ${all.map(esc).join(' · ')}</div>` : '';
}

function checklistTab(t) {
  const items = t.checklist || [], done = items.filter(c => c.done).length, today = todayStr();
  const groups = [...new Set(items.map(c => c.group || 'General'))];
  return `<div class="flex items-center justify-between mb-3"><div class="text-sm text-navy-600">${done} of ${items.length} done</div><button class="btn btn-sand" data-act="addCheck">+ Item</button></div>`
    + (groups.map(g => `<div class="card p-3 mb-3"><div class="text-xs uppercase tracking-wider text-sand-600 mb-1">${esc(g)}</div>${items.filter(c => (c.group || 'General') === g).map(c => {
      let u = '';
      if (!c.done && c.due) { const n = dayDiff(today, c.due); u = n < 0 ? `<span class="badge bg-red-100 text-red-800">Overdue ${-n}d</span>` : n <= 7 ? `<span class="badge bg-amber-100 text-amber-800">Due in ${n}d</span>` : `<span class="badge bg-sand-100 text-sand-600">Due ${fmtShort(c.due)}</span>`; }
      return `<div class="flex items-center gap-3 py-1.5 border-t border-sand-100"><input type="checkbox" ${c.done ? 'checked' : ''} data-act="toggleCheck" data-id="${c.id}"><span class="flex-1 text-sm ${c.done ? 'line-through text-navy-600' : ''}">${esc(c.text)}${checkLink(t, c)}</span>${u}<button class="text-xs underline text-navy-600" data-act="editCheck" data-id="${c.id}">Edit</button></div>`;
    }).join('')}</div>`).join('') || '<div class="card p-6 text-center text-navy-600">Nothing on the checklist yet.</div>');
}
function checkModal(t, id) {
  const c = id ? t.checklist.find(x => x.id === id) : { text: '', group: 'General', due: '', done: false, bookingId: '' };
  const groups = [...new Set(t.checklist.map(x => x.group || 'General'))];
  openModal(`<h2 class="font-serif text-xl font-bold">${id ? 'Edit item' : 'Add checklist item'}</h2><form>
    ${field('To do', 'text', c.text, 'text', 'required')}${field('Group', 'group', c.group || 'General', 'text', 'list="grpList"')}<datalist id="grpList">${groups.map(g => `<option value="${esc(g)}">`).join('')}</datalist>
    ${field('Due date (optional)', 'due', c.due || '', 'date')}
    <label class="lbl">Linked booking (optional)</label><select class="inp" name="bookingId"><option value="">None</option>${t.bookings.map(b => `<option value="${b.id}" ${b.id === c.bookingId ? 'selected' : ''}>${esc(b.title)}</option>`).join('')}</select>
    <p class="text-xs text-navy-600 mt-1">Ticking this item marks the booking booked/paid, and the other way round.</p>${modalFoot(id ? '<button type="button" class="btn btn-danger" id="delChk">Delete</button>' : '')}</form>`, fd => {
    Object.assign(c, { text: fd.get('text').trim(), group: fd.get('group').trim() || 'General', due: fd.get('due'), bookingId: fd.get('bookingId') || '' });
    if (!id) { c.id = uid(); t.checklist.push(c); }
    commit();
  });
  const del = $('#delChk'); if (del) del.onclick = () => { t.checklist = t.checklist.filter(x => x.id !== id); closeModal(); commit(); };
}

/* v1 -> v2: booking details, stop end times and links, checklist. Runs once per data set. */
function migrate(d) {
  d.trips.forEach(t => { t.checklist = t.checklist || []; });
  if ((d.version || 1) >= 2) return migrate3(d);
  d.trips.forEach(t => {
    t.bookings.forEach(b => {
      b.category = b.category || (/flight|SIA/i.test(b.title) ? 'flight' : /adina|quest|resort|hotel|stay/i.test(b.title) ? 'stay' : /car rental/i.test(b.title) ? 'car' : /zoo|ferry|bus|cave|tour|ticket/i.test(b.title) ? 'attraction' : 'other');
      if (b.bookedVia == null) b.bookedVia = (b.title.match(/\((Trip\.com|Klook|Agoda|Booking\.com)\)/i) || [])[1] || '';
      if (b.category === 'flight' && !b.carrier && /SIA/i.test(b.title)) b.carrier = 'Singapore Airlines';
      if (b.pax === undefined) b.pax = /Marvin \+ Cobae/.test(b.title) ? 2 : (b.category === 'flight' && /Caroline/.test(b.title)) ? 1 : null;
      b.carrier = b.carrier || ''; b.seats = b.seats || '';
    });
    t.days.forEach(day => day.stops.forEach(s => { s.endTime = s.endTime || ''; s.bookingIds = s.bookingIds || []; }));
    if (t.id === 'perth-2026') {
      const find = re => t.bookings.filter(b => re.test(b.title)).map(b => b.id);
      const rules = [
        [/SQ213|SQ226/, () => find(/SIA flight/i)], [/rental car/i, () => find(/Car rental/i)], [/Perth Zoo/i, () => find(/Perth Zoo/i)],
        [/Rottnest/i, () => find(/Rottnest/i)], [/Jewel Cave/i, () => find(/Jewel Cave/i)], [/Quest/i, () => find(/^Quest/i)],
        [/Margaret River Resort/i, () => find(/Margaret River Resort/i)], [/Adina/i, di => find(di < 3 ? /Adina.*2–5/ : /Adina.*7–8/)]
      ];
      t.days.forEach((day, di) => day.stops.forEach(s => { if (!s.bookingIds.length) for (const [re, fn] of rules) if (re.test(s.title)) { s.bookingIds = fn(di); break; } }));
      if (!t.checklist.length) t.checklist = [
        ['Flights', 'Flight pre check-in: SQ213 (2 Nov outbound)'], ['Flights', 'Flight pre check-in: SQ226 (8 Nov return)'],
        ['Documents', 'Australia ETA / visa application'], ['Money', 'Currency exchanged (AUD)'],
        ['Bookings', 'Pay Rottnest ferry (Klook)'], ['Bookings', 'Pay Jewel Cave (Klook)'], ['Bookings', 'Confirm Quest 4–5 Nov vs Adina 2–5 Nov overlap'],
        ['Trip', 'Check toddler-friendly wineries near Leeuwin Estate']
      ].map(([group, text]) => ({ id: uid(), text, group, done: false, due: '' }));
    }
  });
  d.version = 2; return migrate3(d);
}
/* v2 -> v3: checklist items named "Pay X" link to the booking whose title contains X. Link only: neither flag is changed, and a mismatch shows as a badge. */
function migrate3(d) {
  if ((d.version || 1) >= 3) return d;
  d.trips.forEach(t => (t.checklist || []).forEach(c => {
    if (c.bookingId !== undefined) return;
    c.bookingId = '';
    const m = /^pay\s+(.+?)(\s*\(.*\))?$/i.exec(c.text || '');
    if (m) { const b = t.bookings.find(x => x.title.toLowerCase().includes(m[1].toLowerCase())); if (b) c.bookingId = b.id; }
  }));
  d.version = 3; return d;
}

/* ===== Timeline helpers + import ===== */
const toMin = v => { const [h, m] = v.split(':').map(Number); return h * 60 + m; };
const fmtDur = m => { const h = Math.floor(m / 60), r = m % 60; return h ? h + 'h' + (r ? ' ' + r + 'm' : '') : r + 'm'; };
function stopSpan(stops, i) {
  const s = stops[i]; if (!s.time) return null;
  let end = s.endTime, inferred = false;
  if (!end) { const nx = stops.slice(i + 1).find(x => x.time); if (nx && toMin(nx.time) > toMin(s.time)) { end = nx.time; inferred = true; } }
  if (!end) return null;
  let m = toMin(end) - toMin(s.time); if (m < 0 && !inferred) m += 1440;
  return { end, inferred, dur: m > 0 ? fmtDur(m) : '' };
}

function resolveLinks(t, books) {

  t.days.forEach(d => d.stops.forEach(s => {

    s.bookingIds = books.filter(b => links.some(l => b.title.toLowerCase().includes(String(l).toLowerCase()))).map(b => b.id);

const MENU_FOLDER = 'VacationGuru Menus', MENU_CACHE = 'vg-menus';
const menuErr = e => e.message === 'Not connected' ? 'Connect Drive first (button at the top), then try again.'

const safeName = s => s.replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 120);
function shrink(file, max = 1600) {

      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? res(b) : rej(new Error('Could not compress ' + file.name)), 'image/jpeg', 0.8);
    };

/* Cache API copy so menus open at the restaurant with no signal. Per device; silently skipped if unavailable. */

  const j = await (await drive(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id)`)).json();
  let id = j.files && j.files[0] && j.files[0].id;

const PDF_MAX = 20 * 1024 * 1024;
const isPdf = f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
async function addMenu(t, s, file) {   // s.menuImages holds photos and PDFs: [{ fileId, name, mime }]

const loadScript = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load the PDF library. Check your connection and try again.')); document.head.appendChild(s); });

  text(`Status: ${STATUS[t.status][0]} | Exported ${new Date().toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })}`, 9);

        const bits = [b.confirmation && 'Ref ' + b.confirmation, b.seats && 'Seats ' + b.seats].filter(Boolean).join(', ');
        det.push(`Booking: ${b.title}${bits ? ' (' + bits + ')' : ''}${b.booked ? '' : ' - NOT BOOKED YET'}`);
      });

      body: rows.length ? rows : [[{ content: 'Nothing planned yet.', colSpan: 4 }]],

    head: [['Booking', 'Reference', 'Via / carrier', 'Pax', 'Cost', 'Status']],

    foot: [[{ content: 'Total of recorded costs', colSpan: 4, styles: { halign: 'right' } }, money(bTotal), '']], footStyles: { fillColor: SAND, textColor: NAVY, fontStyle: 'bold' },
    columnStyles: { 0: { cellWidth: 190 }, 3: { cellWidth: 30 }, 4: { cellWidth: 60 } }

async function exportPdf(t, btn) {

    const file = new File([doc.output('blob')], name, { type: 'application/pdf' });

      try { await navigator.share({ files: [file], title: t.name }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }

  } catch (e) { alert('PDF export failed: ' + e.message); }

}

  if (a === 'newTrip') return newTripModal();
  if (a === 'importTrip') return importModal();
  if (a === 'openTrip') { view = { page: 'trip', tripId: el.dataset.id, tab: 'itinerary' }; loadPdfLibs().catch(() => {}); return render(); }
  if (a === 'exportPdf') return exportPdf(t, el);
  if (a === 'back') { view = { page: 'list', tripId: null, tab: 'itinerary' }; return render(); }
  if (a === 'tab') { view.tab = el.dataset.tab; return render(); }
  if (a === 'startTrip') { t.status = 'active'; return commit(); }
  if (a === 'backToPlanning') { t.status = 'planning'; return commit(); }
  if (a === 'lockTrip') return openModal(`<h2 class="font-serif text-xl font-bold mb-2">Lock "${esc(t.name)}"?</h2><p class="text-sm text-navy-600">The itinerary and bookings become read-only reference data. You'll go straight into the ratings pass; ratings and actuals notes stay editable afterwards.</p><div class="flex justify-end gap-2 mt-5"><button class="btn btn-sand" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="confirmLock">Lock and rate</button></div>`) || ($('#confirmLock').onclick = () => { t.status = 'locked'; t.lockedAt = new Date().toISOString(); closeModal(); commit(); ratingsModal(t); });
  if (a === 'ratings') return ratingsModal(t);
  if (a === 'editTrip') return editTripModal(t);
  if (a === 'addStop') return stopModal(t, +el.dataset.day, null);
  if (a === 'editStop') return stopModal(t, +el.dataset.day, el.dataset.id);
  if (a === 'addFood') return foodAddModal(t);
  if (a === 'openMenu') return menuGallery(t, +el.dataset.day, el.dataset.id);
  if (a === 'addBooking') return bookingModal(t, null);
  if (a === 'editBooking') return bookingModal(t, el.dataset.id);
  if (a === 'addCheck') return checkModal(t, null);
  if (a === 'editCheck') return checkModal(t, el.dataset.id);
  if (a === 'toggleCheck') { const c = t.checklist.find(x => x.id === el.dataset.id); setCheck(t, c, el.checked); return commit(); }
  if (a === 'toggleBooked') { const b = t.bookings.find(x => x.id === el.dataset.id); setBooked(t, b, el.checked); return commit(); }
});

function newTripModal() {
  const skel = D.trips.filter(t => t.status === 'locked');
  openModal(`<h2 class="font-serif text-xl font-bold">New trip</h2><form>
    ${field('Trip name', 'name', '', 'text', 'required')}${field('Destination', 'destination')}
    <div class="grid grid-cols-2 gap-3"><div>${field('Start', 'start', '', 'date', 'required')}</div><div>${field('End', 'end', '', 'date', 'required')}</div></div>
    ${field('Travellers (comma separated)', 'travellers', 'Marvin, Caroline, Cobae (toddler)')}
    ${skel.length ? `<label class="lbl">Build from skeleton</label><select class="inp" name="skeleton"><option value="">Start blank</option>${skel.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><p class="text-xs text-navy-600 mt-1">Inherits tags, budget tier and stops you rated 4★ or higher.</p>` : '<p class="text-xs text-navy-600 mt-3">Lock a finished trip to unlock skeleton building.</p>'}
    <p id="formErr" class="text-sm text-red-700 mt-2"></p>${modalFoot()}</form>`, fd => {
    const start = fd.get('start'), end = fd.get('end');
    if (end < start) { $('#formErr').textContent = 'End date is before the start date.'; return false; }
    const n = dayDiff(start, end) + 1;
    if (n > 60) { $('#formErr').textContent = 'Trips are capped at 60 days.'; return false; }
    const sk = D.trips.find(x => x.id === fd.get('skeleton'));
    const nt = { id: uid(), name: fd.get('name').trim(), destination: fd.get('destination').trim(), start, end, status: 'planning',
      tags: sk ? [...sk.tags] : [], budgetTier: sk ? sk.budgetTier : '$$', travellers: fd.get('travellers').split(',').map(s => s.trim()).filter(Boolean), notes: sk ? `Built from skeleton: ${sk.name}` : '', lockedAt: null,
      days: Array.from({ length: n }, (_, i) => ({ date: addDays(start, i), stops: [] })), bookings: [], checklist: sk ? sk.checklist.map(c => ({ ...c, id: uid(), done: false, due: '', bookingId: '' })) : [] };
    if (sk) sk.days.forEach((d, i) => d.stops.filter(s => s.rating >= 4).forEach(s => nt.days[Math.min(i, n - 1)].stops.push({ ...s, id: uid(), rating: 0, actualNotes: '', cost: s.cost, notes: s.notes, bookingIds: [], menuImages: [] })));
    D.trips.push(nt); view = { page: 'trip', tripId: nt.id, tab: 'itinerary' }; commit();
  });
}

function editTripModal(t) {
  openModal(`<h2 class="font-serif text-xl font-bold">Edit trip</h2><form>
    ${field('Trip name', 'name', t.name, 'text', 'required')}${field('Destination', 'destination', t.destination)}
    ${field('Travellers (comma separated)', 'travellers', t.travellers.join(', '))}${field('Tags (comma separated)', 'tags', t.tags.join(', '))}
    <label class="lbl">Budget tier</label><select class="inp" name="tier">${['$', '$$', '$$$'].map(x => `<option ${x === t.budgetTier ? 'selected' : ''}>${x}</option>`).join('')}</select>
    <label class="lbl">Notes</label><textarea class="inp" name="notes" rows="3">${esc(t.notes)}</textarea>
    ${modalFoot('<button type="button" class="btn btn-danger" id="delTrip">Delete trip</button>')}</form>`, fd => {
    t.name = fd.get('name').trim(); t.destination = fd.get('destination').trim();
    t.travellers = fd.get('travellers').split(',').map(s => s.trim()).filter(Boolean); t.tags = fd.get('tags').split(',').map(s => s.trim()).filter(Boolean);
    t.budgetTier = fd.get('tier'); t.notes = fd.get('notes'); commit();
  });
  $('#delTrip').onclick = () => { if (confirm(`Delete "${t.name}"? This cannot be undone.`)) { D.trips = D.trips.filter(x => x.id !== t.id); view = { page: 'list', tripId: null, tab: 'itinerary' }; closeModal(); commit(); } };
}

function stopModal(t, di, id, preset) {
  const locked = t.status === 'locked';
  const s = id ? t.days[di].stops.find(x => x.id === id) : { type: preset || 'activity', time: '', endTime: '', title: '', notes: '', cost: null, link: '', rating: 0, actualNotes: '', bookingIds: [] };
  let rating = s.rating || 0;
  const ro = locked ? 'disabled' : '';
  openModal(`<h2 class="font-serif text-xl font-bold">${locked ? 'Rate: ' + esc(s.title) : id ? 'Edit stop' : 'Add stop'} <span class="text-sm font-sans text-navy-600">Day ${di + 1}</span></h2><form>
    <label class="lbl">Type</label><select class="inp" name="type" ${ro}>${Object.entries(TYPES).map(([k, v]) => `<option value="${k}" ${k === s.type ? 'selected' : ''}>${v[0]} ${v[1]}</option>`).join('')}</select>
    ${field('Title', 'title', s.title, 'text', 'required ' + ro)}
    <div class="grid grid-cols-3 gap-3"><div>${field('Starts', 'time', s.time, 'time', ro)}</div><div>${field('Ends', 'endTime', s.endTime || '', 'time', ro)}</div><div>${field('Spend', 'cost', s.cost ?? '', 'number', 'step="0.01" ' + ro)}</div></div>
    ${field('Link', 'link', s.link, 'url', ro)}
    <p class="text-xs text-navy-600 mt-1">Spend is extra money on the day. Prepaid costs live under Bookings. Enter 0 if there is nothing extra.</p>
    <label class="lbl">Linked bookings</label><div class="border border-sand-200 rounded-lg p-2 max-h-32 overflow-y-auto bg-sand-50">${t.bookings.length ? t.bookings.map(bk => `<label class="flex items-center gap-2 text-sm py-0.5"><input type="checkbox" name="bk" value="${bk.id}" ${(s.bookingIds || []).includes(bk.id) ? 'checked' : ''} ${ro}> ${CATS[bk.category || 'other'][0]} ${esc(bk.title)}</label>`).join('') : '<span class="text-xs text-navy-600">No bookings yet.</span>'}</div>
    <label class="lbl">Menus (photos or PDF)</label><div id="menuBox" class="border border-sand-200 rounded-lg p-2 bg-sand-50"></div>
    <label class="lbl">Notes</label><textarea class="inp" name="notes" rows="2" ${ro}>${esc(s.notes)}</textarea>
    <label class="lbl">Rating</label><div id="starBox">${stars(rating, true)}</div>
    <label class="lbl">Actuals notes</label><textarea class="inp" name="actualNotes" rows="2">${esc(s.actualNotes)}</textarea>
    ${modalFoot(id && !locked ? '<button type="button" class="btn btn-danger" id="delStop">Delete</button>' : '')}</form>`, fd => {
    if (!locked) { s.type = fd.get('type'); s.title = fd.get('title').trim(); s.time = fd.get('time'); s.endTime = fd.get('endTime'); s.bookingIds = fd.getAll('bk'); s.cost = num(fd.get('cost')); s.link = fd.get('link').trim(); s.notes = fd.get('notes'); }
    s.rating = rating; s.actualNotes = fd.get('actualNotes');
    if (!id) { s.id = uid(); t.days[di].stops.push(s); }
    commit();
  });
  $('#starBox').onclick = e => { const st = e.target.closest('[data-star]'); if (!st) return; const v = +st.dataset.star; rating = rating === v ? 0 : v; $('#starBox').innerHTML = stars(rating, true); };
  menuUI(t, s, !!id && !locked, !id);
  const del = $('#delStop'); if (del) del.onclick = () => { t.days[di].stops = t.days[di].stops.filter(x => x.id !== id); closeModal(); commit(); };
}

function bookingModal(t, id) {
  const b = id ? t.bookings.find(x => x.id === id) : { category: 'other', title: '', confirmation: '', bookedVia: '', carrier: '', seats: '', pax: null, cost: null, deadline: '', booked: false, notes: '' };
  openModal(`<h2 class="font-serif text-xl font-bold">${id ? 'Edit booking' : 'Add booking'}</h2><form>
    <label class="lbl">Category</label><select class="inp" name="category" id="catSel">${Object.entries(CATS).map(([k, v]) => `<option value="${k}" ${k === (b.category || 'other') ? 'selected' : ''}>${v[0]} ${v[1]}</option>`).join('')}</select>
    ${field('What', 'title', b.title, 'text', 'required')}${field('Booking reference', 'confirmation', b.confirmation)}
    ${field('Booked via (Direct, Trip.com, Agoda, Klook…)', 'bookedVia', b.bookedVia || '', 'text', 'list="viaList"')}<datalist id="viaList">${VIAS.map(v => `<option value="${v}">`).join('')}</datalist>
    <div id="flightFields" class="${b.category === 'flight' ? '' : 'hidden'}">${field('Carrier', 'carrier', b.carrier || '')}${field('Seats', 'seats', b.seats || '', 'text', 'placeholder="e.g. Out 32A/32B · Back 41C"')}</div>
    <div class="grid grid-cols-3 gap-3"><div>${field('Cost', 'cost', b.cost ?? '', 'number', 'step="0.01"')}</div><div>${field('Pax covered', 'pax', b.pax ?? '', 'number', 'min="1" step="1"')}</div><div>${field('Deadline', 'deadline', b.deadline, 'date')}</div></div>
    ${field('Notes', 'notes', b.notes)}
    <label class="flex items-center gap-2 mt-3 text-sm"><input type="checkbox" name="booked" ${b.booked ? 'checked' : ''}> Booked / paid</label>
    ${modalFoot(id ? '<button type="button" class="btn btn-danger" id="delBk">Delete</button>' : '')}</form>`, fd => {
    Object.assign(b, { category: fd.get('category'), bookedVia: fd.get('bookedVia').trim(), carrier: fd.get('carrier').trim(), seats: fd.get('seats').trim(), pax: num(fd.get('pax')), title: fd.get('title').trim(), confirmation: fd.get('confirmation').trim(), cost: num(fd.get('cost')), deadline: fd.get('deadline'), notes: fd.get('notes'), booked: fd.get('booked') === 'on' });
    if (!id) { b.id = uid(); t.bookings.push(b); } else setBooked(t, b, b.booked);
    commit();
  });
  $('#catSel').onchange = e => $('#flightFields').classList.toggle('hidden', e.target.value !== 'flight');
  const del = $('#delBk'); if (del) del.onclick = () => {
    t.bookings = t.bookings.filter(x => x.id !== id);
    t.days.forEach(d => d.stops.forEach(s => { s.bookingIds = (s.bookingIds || []).filter(x => x !== id); }));   // no dangling links
    (t.checklist || []).forEach(c => { if (c.bookingId === id) c.bookingId = ''; });
    closeModal(); commit();
  };
}

function ratingsModal(t) {
  const all = t.days.flatMap((d, i) => d.stops.map(s => ({ s, i })));
  const draft = {}; all.forEach(({ s }) => draft[s.id] = { r: s.rating || 0, n: s.actualNotes || '' });
  openModal(`<h2 class="font-serif text-xl font-bold mb-1">Ratings pass</h2><p class="text-sm text-navy-600 mb-3">Rate each stop and note what actually happened. 4★ and up carry into future skeletons.</p>
    <div class="max-h-[60vh] overflow-y-auto pr-1">${all.map(({ s, i }) => `<div class="py-2 border-t border-sand-100" data-rid="${s.id}">
      <div class="text-sm font-medium">${TYPES[s.type][0]} ${esc(s.title)} <span class="text-xs text-navy-600">Day ${i + 1}</span></div>
      <div class="rbox">${stars(draft[s.id].r, true)}</div>
      <input class="inp mt-1" placeholder="Actuals notes" value="${esc(draft[s.id].n)}"></div>`).join('') || '<p class="text-sm">No stops to rate.</p>'}</div>
    <div class="flex justify-end gap-2 mt-4"><button class="btn btn-sand" onclick="closeModal()">Later</button><button class="btn btn-primary" id="saveRatings">Save ratings</button></div>`);
  $('#modalBox').onclick = e => { const st = e.target.closest('[data-star]'); if (!st) return; const row = st.closest('[data-rid]'); const v = +st.dataset.star; const d = draft[row.dataset.rid]; d.r = d.r === v ? 0 : v; row.querySelector('.rbox').innerHTML = stars(d.r, true); };
  $('#saveRatings').onclick = () => {
    $('#modalBox').querySelectorAll('[data-rid]').forEach(row => { draft[row.dataset.rid].n = row.querySelector('input').value; });
    all.forEach(({ s }) => { s.rating = draft[s.id].r; s.actualNotes = draft[s.id].n; });
    $('#modalBox').onclick = null; closeModal(); commit();
  };
}

/* ===== Boot ===== */
setSync('off', ''); bootSync();
render();
</script>
</body>
</html>
